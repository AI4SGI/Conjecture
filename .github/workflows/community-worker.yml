name: Deploy community API

on:
  push:
    branches: [main]
    paths:
      - community-worker.ts
      - src/worker/**
      - wrangler.community.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/community-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy standalone community Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping community Worker deployment."
            exit 0
          fi
          npm run deploy:community
